name: hotel-offer-orchestrator

x-app-env: &app-env
  # The admin failure toggle is part of the demo, so run as "development" inside compose.
  NODE_ENV: development
  LOG_LEVEL: info
  SUPPLIER_BASE_URL: http://api:3000
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: default
  TEMPORAL_TASK_QUEUE: hotel-offers
  REDIS_URL: redis://redis:6379
  CACHE_TTL_SECONDS: 300
  SUPPLIER_A_DOWN: ${SUPPLIER_A_DOWN:-false}
  SUPPLIER_B_DOWN: ${SUPPLIER_B_DOWN:-false}

services:
  api:
    build: .
    image: hotel-offer-orchestrator:local
    command: ["node", "dist/api/server.js"]
    environment:
      <<: *app-env
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    # Same image as `api` (built by the api service); never try to pull it from a registry.
    image: hotel-offer-orchestrator:local
    pull_policy: never
    command: ["node", "dist/worker/index.js"]
    environment: *app-env
    depends_on:
      api:
        condition: service_healthy # activities call the mock suppliers on the API
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    # Official Temporal CLI image running the dev server: Temporal server + Web UI in one
    # container, "default" namespace created on start. State is in-memory (fine for local/demo).
    image: temporalio/temporal:1.9.1
    entrypoint: ["temporal"]
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-port", "8080", "--namespace", "default", "--log-level", "warn"]
    ports:
      - "7233:7233" # gRPC frontend
      - "8080:8080" # Web UI
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233", "--command-timeout", "3s"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
